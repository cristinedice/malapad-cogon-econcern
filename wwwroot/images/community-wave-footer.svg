<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none" width="100%" height="220">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d65a3" />
      <stop offset="50%" stop-color="#0b5791" />
      <stop offset="100%" stop-color="#073860" />
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90c7eb" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#5fa8dc" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="bgHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4e8f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#b8dbf2" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Far Rolling Hills (Sigma, Capiz Landscape) -->
  <path d="M 0 180 Q 250 110 500 160 T 1000 130 T 1440 170 L 1440 320 L 0 320 Z" fill="url(#bgHills)" />

  <!-- Midground Silhouette: Rural Buildings, Chapel, Gym, Coconut Trees, Cyclists -->
  <g fill="url(#silhouetteGrad)">
    <!-- Left: Parish / Chapel with Bell Tower -->
    <rect x="30" y="140" width="80" height="70" rx="3" />
    <!-- Chapel Roof -->
    <polygon points="25,140 70,95 115,140" />
    <!-- Bell Tower -->
    <rect x="115" y="100" width="30" height="110" />
    <polygon points="110,100 130,65 150,100" />
    <line x1="130" y1="65" x2="130" y2="52" stroke="#6aaad7" stroke-width="2" />
    <line x1="126" y1="57" x2="134" y2="57" stroke="#6aaad7" stroke-width="2" />
    <!-- Church Windows -->
    <path d="M 55 160 A 8 8 0 0 1 71 160 L 71 185 L 55 185 Z" fill="#ffffff" opacity="0.4" />
    <path d="M 80 160 A 8 8 0 0 1 96 160 L 96 185 L 80 185 Z" fill="#ffffff" opacity="0.4" />

    <!-- Rural Houses & Community Trees -->
    <polygon points="160,165 195,140 230,165" />
    <rect x="165" y="165" width="60" height="45" />

    <!-- Coconut Palms -->
    <!-- Palm 1 -->
    <path d="M 245 210 Q 252 160 250 120" stroke="url(#silhouetteGrad)" stroke-width="5" fill="none" />
    <path d="M 250 120 Q 230 110 215 125 M 250 120 Q 240 100 235 85 M 250 120 Q 260 95 270 90 M 250 120 Q 275 110 285 125" stroke="url(#silhouetteGrad)" stroke-width="3" fill="none" />

    <!-- Bicycle & Resident -->
    <circle cx="310" cy="195" r="11" fill="none" stroke="url(#silhouetteGrad)" stroke-width="2.5" />
    <circle cx="340" cy="195" r="11" fill="none" stroke="url(#silhouetteGrad)" stroke-width="2.5" />
    <line x1="310" y1="195" x2="325" y2="195" stroke="url(#silhouetteGrad)" stroke-width="2.5" />
    <line x1="325" y1="195" x2="335" y2="182" stroke="url(#silhouetteGrad)" stroke-width="2.5" />
    <line x1="325" y1="195" x2="320" y2="180" stroke="url(#silhouetteGrad)" stroke-width="2.5" />
    <line x1="320" y1="180" x2="340" y2="195" stroke="url(#silhouetteGrad)" stroke-width="2.5" />
    <!-- Rider -->
    <circle cx="325" cy="168" r="4.5" />
    <line x1="325" y1="172" x2="323" y2="185" stroke="url(#silhouetteGrad)" stroke-width="3" />
    <line x1="323" y1="185" x2="325" y2="195" stroke="url(#silhouetteGrad)" stroke-width="2.5" />
    <line x1="325" y1="176" x2="335" y2="180" stroke="url(#silhouetteGrad)" stroke-width="2.5" />

    <!-- Right Side: Barangay Hall & Covered Gym Structure -->
    <rect x="1120" y="115" width="220" height="95" rx="4" />
    <!-- Pillars of Gym/Hall -->
    <rect x="1140" y="140" width="12" height="70" fill="#ffffff" opacity="0.3" />
    <rect x="1170" y="140" width="12" height="70" fill="#ffffff" opacity="0.3" />
    <rect x="1200" y="140" width="12" height="70" fill="#ffffff" opacity="0.3" />
    <rect x="1230" y="140" width="12" height="70" fill="#ffffff" opacity="0.3" />
    <rect x="1260" y="140" width="12" height="70" fill="#ffffff" opacity="0.3" />
    <rect x="1290" y="140" width="12" height="70" fill="#ffffff" opacity="0.3" />
    <polygon points="1110,115 1230,80 1350,115" />
    
    <!-- Flagpole -->
    <line x1="1230" y1="80" x2="1230" y2="40" stroke="url(#silhouetteGrad)" stroke-width="2" />
    <polygon points="1230,42 1248,47 1230,53" />

    <!-- Right Palm Trees -->
    <path d="M 1370 210 Q 1362 155 1370 115" stroke="url(#silhouetteGrad)" stroke-width="5" fill="none" />
    <path d="M 1370 115 Q 1350 105 1335 120 M 1370 115 Q 1360 95 1355 80 M 1370 115 Q 1380 90 1395 85 M 1370 115 Q 1395 105 1405 120" stroke="url(#silhouetteGrad)" stroke-width="3" fill="none" />
  </g>

  <!-- Foreground Flowing Curved Blue Wave (Exact match to Marikina e-concern wave) -->
  <path d="M 0 210 Q 360 170 720 220 T 1440 200 L 1440 320 L 0 320 Z" fill="url(#waveGrad)" />
  <path d="M 0 225 Q 400 185 750 232 T 1440 215 L 1440 320 L 0 320 Z" fill="#073a62" opacity="0.4" />
</svg>
